name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Backend dependencies and regressions
        run: |
          npm ci
          npm run check
          npm test
      - name: Launcher browser regression
        shell: pwsh
        run: |
          node test/launcher-browser.cjs 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare self-contained runtime
        run: node scripts/prepare-tauri.cjs x86_64-pc-windows-msvc
      - name: Include runtime license
        shell: bash
        run: curl --fail --location "https://raw.githubusercontent.com/nodejs/node/$(node -p process.version)/LICENSE" --output src-tauri/backend/NODE-LICENSE.txt
      - name: Test packaged backend without developer dependencies
        shell: bash
        run: |
          export EASYAG_TEST_NODE="$PWD/src-tauri/binaries/easyag-node-x86_64-pc-windows-msvc.exe"
          export EASYAG_TEST_SERVER="$PWD/src-tauri/backend/server.js"
          node test/tauri-lifecycle.test.cjs
      - name: Build native application
        run: npx --yes @tauri-apps/cli@2 build --target x86_64-pc-windows-msvc --no-bundle
      - name: Package Windows portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'EasyAG-4.1.0-windows-x64'
          $stage = Join-Path 'dist-tauri' $name
          New-Item -ItemType Directory -Path $stage | Out-Null
          $release = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          Copy-Item -LiteralPath "$release/easyantigravity.exe" -Destination "$stage/EasyAntigravity.exe"
          Copy-Item -LiteralPath 'src-tauri/binaries/easyag-node-x86_64-pc-windows-msvc.exe' -Destination "$stage/easyag-node.exe"
          Copy-Item -LiteralPath 'src-tauri/backend' -Destination "$stage/backend" -Recurse
          Get-ChildItem -LiteralPath $release -Filter '*.dll' -File | Copy-Item -Destination $stage
          Copy-Item -LiteralPath 'LICENSE','README.md','RELEASE_NOTES.md','THIRD-PARTY-NOTICES.md','NODE-LICENSE.txt' -Destination $stage
          Compress-Archive -LiteralPath $stage -DestinationPath "$name.zip"
          Expand-Archive -LiteralPath "$name.zip" -DestinationPath 'dist-tauri/verify'
          $extracted = (Resolve-Path "dist-tauri/verify/$name").Path
          foreach ($file in @('EasyAntigravity.exe','easyag-node.exe','README.md','RELEASE_NOTES.md','LICENSE','NODE-LICENSE.txt','backend/server.js','backend/index.html','backend/package.json','backend/node_modules/ws/package.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $extracted $file))) { throw "Missing portable resource: $file" }
          }
          $env:EASYAG_TEST_NODE = Join-Path $extracted 'easyag-node.exe'
          $env:EASYAG_TEST_SERVER = Join-Path $extracted 'backend/server.js'
          node test/tauri-lifecycle.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash -LiteralPath "$name.zip" -Algorithm SHA256
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: EasyAG-4.1.0-windows-x64
          path: EasyAG-4.1.0-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
